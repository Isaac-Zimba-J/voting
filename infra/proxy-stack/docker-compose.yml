services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
      # Per-vhost proxy timeout overrides (see comments in each file) -
      # layered on top of the vhost.d named volume above.
      - ./vhost.d/cbuvoting1.work.gd_location:/etc/nginx/vhost.d/cbuvoting1.work.gd_location:ro
      - ./vhost.d/cbuvoting2.work.gd_location:/etc/nginx/vhost.d/cbuvoting2.work.gd_location:ro
      # New domain (cbuvoting.site) - kept alongside the work.gd ones above
      # during the migration; drop the work.gd mounts and DNS once cutover
      # is confirmed stable.
      - ./vhost.d/app.cbuvoting.site_location:/etc/nginx/vhost.d/app.cbuvoting.site_location:ro
      - ./vhost.d/apps.cbuvoting.site_location:/etc/nginx/vhost.d/apps.cbuvoting.site_location:ro
    networks:
      - proxy-net

  acme-companion:
    image: nginxproxy/acme-companion
    restart: unless-stopped
    volumes_from:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true

volumes:
  conf:
  vhost:
  html:
  certs:
